name: Frontend E2E (Selenium)

on:
  push:
    paths:
      - 'frontend/rings/**'
      - '.github/workflows/frontend-e2e.yml'
  pull_request:
    paths:
      - 'frontend/rings/**'
      - '.github/workflows/frontend-e2e.yml'
  workflow_dispatch: {}

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: frontend/rings

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/rings/package-lock.json'

      - name: Install dependencies
        run: npm ci

      # Use build-only to skip vue-tsc in CI
      - name: Build app (no type-check)
        run: npm run build-only

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Start preview server and wait
        run: |
          npm run preview -- --port 5173 --strictPort --host &
          npx wait-on http://localhost:5173

      - name: Run E2E (Selenium)
        env:
          CI: 'true'
          BASE_URL: 'http://localhost:5173'
          ARTIFACT_DIR: 'tests/e2e/artifacts'
        run: |
          xvfb-run -a npm run test:e2e

      - name: Upload E2E artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: |
            frontend/rings/tests/e2e/artifacts/logs/**
            frontend/rings/tests/e2e/artifacts/screenshots/**
          if-no-files-found: ignore
      
      - name: Clean previous artifacts (logs + screenshots)
        run: |
          rm -rf tests/e2e/artifacts/logs/*
          rm -rf tests/e2e/artifacts/screenshots/
